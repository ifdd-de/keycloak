# IFDD login theme: Keycloak's keycloak.v2 theme with a calmer look.
# Styles only: the templates and texts come from the parent theme, so a
# Keycloak upgrade does not break the pages. Selected by the realm setting
# loginTheme=ifdd (realm/ifdd_realm/realm.py).
parent=keycloak.v2
styles=css/styles.css css/ifdd.css
