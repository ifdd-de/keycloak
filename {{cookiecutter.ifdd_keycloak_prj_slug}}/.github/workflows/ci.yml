name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install cruft
      - name: template drift
        run: cruft check || cruft diff
      - name: realm file is generated from values.toml and up to date
        run: python3 realm/build_realm.py --check
      - name: compose files are valid
        run: |
          # dummy values; the real .env and backups/ are not in git
          sed -E -e 's/<<generate:[^>]*>>/ci-dummy-value/' -e 's/<<host:(uid|gid)>>/1000/' dotenv.dist > .env
          mkdir -p backups
          docker compose -f docker-compose-production.yml config -q
          docker compose -f docker-compose-development.yml config -q
