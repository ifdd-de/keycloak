# Keycloak in development mode on 127.0.0.1, without the proxy.
# Same database and realm import as in production; start-dev uses HTTP and
# relaxed host checks. The realm's redirect URIs still name the production
# hosts, so logins of the other services do not work against this instance.
#
#   docker compose -f docker-compose-development.yml up -d
#   open http://127.0.0.1:${IFDD_KEYCLOAK_DEV_PORT}/admin/

services:
  postgres:
    image: "{{ cookiecutter.ifdd_keycloak_postgres_image }}"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${IFDD_KEYCLOAK_DB_PASSWORD:?set in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - "no-new-privileges:true"

  keycloak:
    image: "{{ cookiecutter.ifdd_keycloak_image }}"
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${IFDD_KEYCLOAK_DB_PASSWORD:?set in .env}"
      KC_HEALTH_ENABLED: "true"
      # Adds the database check to /health/ready (503 while the DB is gone).
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${IFDD_KEYCLOAK_ADMIN_USER:?set in .env}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${IFDD_KEYCLOAK_ADMIN_PASSWORD:?set in .env}"
      IFDD_KEYCLOAK_API_CLIENT_SECRET: "${IFDD_KEYCLOAK_API_CLIENT_SECRET:?set in .env}"
      IFDD_KEYCLOAK_CT_CLIENT_SECRET: "${IFDD_KEYCLOAK_CT_CLIENT_SECRET:?set in .env}"
      IFDD_KEYCLOAK_USERADMIN_CLIENT_SECRET: "${IFDD_KEYCLOAK_USERADMIN_CLIENT_SECRET:?set in .env}"
      IFDD_KEYCLOAK_TS_CLIENT_SECRET: "${IFDD_KEYCLOAK_TS_CLIENT_SECRET:?set in .env}"
      IFDD_KEYCLOAK_PROXY_CLIENT_SECRET: "${IFDD_KEYCLOAK_PROXY_CLIENT_SECRET:?set in .env}"
      IFDD_KEYCLOAK_TSAPI_CLIENT_SECRET: "${IFDD_KEYCLOAK_TSAPI_CLIENT_SECRET:?set in .env}"
      IFDD_KEYCLOAK_TSINGEST_CLIENT_SECRET: "${IFDD_KEYCLOAK_TSINGEST_CLIENT_SECRET:?set in .env}"
    volumes:
      - ./realm/import:/opt/keycloak/data/import:ro
      # Login theme of the realm (loginTheme=ifdd); a directory theme needs
      # no build. Keycloak caches themes outside start-dev: restart after a change.
      - ./themes/ifdd:/opt/keycloak/themes/ifdd:ro
    ports:
      - "127.0.0.1:${IFDD_KEYCLOAK_DEV_PORT:-{{ cookiecutter.ifdd_keycloak_dev_port }}}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness on the management port 9000 (KC_HEALTH_ENABLED). The image has
      # no curl, so bash speaks HTTP itself; $$ keeps compose from interpolating.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ $$status == 'HTTP/1.1 200'* ]]"
      interval: 15s
      timeout: 5s
      retries: 5
      # The first start builds Keycloak and imports the realm.
      start_period: 180s
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

volumes:
  postgres-data:
